name: hotel_management
description: Hotel Management System - Flutter App
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  provider: ^6.1.1
  http: ^1.1.2
  shared_preferences: ^2.2.2
  image_picker: ^1.0.7
  intl: ^0.19.0
  fl_chart: ^0.66.2
  cached_network_image: ^3.3.1
  file_picker: ^6.1.1
  path_provider: ^2.1.2
  dio: ^5.4.1
  flutter_secure_storage: ^9.0.0
  cupertino_icons: ^1.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
